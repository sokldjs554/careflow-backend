name: Public Readiness

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - careflow-public-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history-scan:
    name: Secret history scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

  tracked-artifact-guard:
    name: Tracked sensitive-artifact guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject local secrets, databases, audio, and model outputs
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.env$|\.(db|sqlite|sqlite3|wav|mp3|m4a|ogg|webm)$|^ai/(outputs|data/training)/' || true)"
          if [ -n "$tracked" ]; then
            echo "Sensitive/local artifacts are tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No prohibited local artifacts are tracked."

  release-metadata-check:
    name: Release metadata check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify public-facing files and explicit boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .env.example
          test -f docs/github-release-checklist.md
          grep -q 'ANTHROPIC_API_KEY=$' .env.example
          grep -q '실제 환자 데이터' README.md
          grep -q '임상' README.md
          grep -q 'SFT' README.md
          grep -q 'DPO' README.md
          echo "Public-facing metadata and safety boundaries are present."
