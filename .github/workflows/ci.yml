name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Unit, lint, type, migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check app tests scripts
      - name: Type check
        run: uv run mypy app
      - name: Unit and contract tests
        run: uv run pytest -m "not integration"
      - name: Clean SQLite migration
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migration.db
        run: uv run alembic upgrade head

  readme_repro:
    name: README install and boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Reproduce documented install
        run: |
          uv python install 3.12
          uv sync --locked --extra dev --extra speech
          cp .env.example .env
      - name: Boot documented application path
        env:
          NOTE_GENERATOR_MODE: deterministic
          DATABASE_URL: sqlite+aiosqlite:///./readme-repro.db
          REDIS_URL: ""
        run: |
          uv run alembic upgrade head
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/careflow-readme-repro.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health/ready > /tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/careflow-readme-repro.log
          exit 1

  ai_lab:
    name: AI lab smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python and AI lab dependencies
        run: |
          uv python install 3.12
          uv sync --locked --extra dev
          uv pip install -r ai/requirements-smoke.txt
      - name: AI lab lint
        run: uv run ruff check ai
      - name: AI lab tests
        run: uv run pytest -q ai/tests
      - name: Retrieval benchmark
        run: uv run python -m ai.lab rag
      - name: Multimodal benchmark
        run: uv run python -m ai.lab multimodal
      - name: Evaluation benchmark
        run: uv run python -m ai.lab evaluation
      - name: SFT and DPO dataset contract
        run: uv run python -m ai.posttrain generate --count 120

  services:
    name: PostgreSQL 16 and Redis 7
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careflow
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --extra dev
      - name: Apply migration to PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://careflow:careflow@localhost:5432/careflow
        run: uv run alembic upgrade head
      - name: Run real-service integration test
        env:
          INTEGRATION_DATABASE_URL: postgresql+asyncpg://careflow:careflow@localhost:5432/careflow
          INTEGRATION_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -m integration

  container:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime image
        run: docker build --tag careflow-backend:ci .
