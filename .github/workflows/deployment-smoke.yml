name: Deployment Smoke

on:
  push:
    branches:
      - main
      - careflow-deployment-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careflow-deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-demo-smoke:
    name: Live Render demo contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_URL: https://careflow-demo.onrender.com
    steps:
      - name: Wait for readiness
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          last_error = None
          for attempt in range(1, 31):
              try:
                  with urllib.request.urlopen(f"{base}/health/ready", timeout=20) as response:
                      payload = json.load(response)
                  if payload == {"status": "ready"}:
                      print(f"ready on attempt {attempt}")
                      break
                  last_error = RuntimeError(f"unexpected readiness payload: {payload}")
              except Exception as exc:
                  last_error = exc
              if attempt < 30:
                  print(f"not ready yet ({attempt}/30): {last_error}")
                  time.sleep(10)
          else:
              raise SystemExit(f"deployment never became ready: {last_error}")
          PY

      - name: Verify product shell and provider-neutral UI
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          with urllib.request.urlopen(f"{base}/", timeout=30) as response:
              html = response.read().decode("utf-8")
          pathlib.Path("live-demo.html").write_text(html, encoding="utf-8")

          required = [
              "Overview",
              "Live Session",
              "Review Queue",
              "AI Quality",
              "Operations",
              "Evidence Coverage",
              "Data Lifecycle",
              "Post-training selection path",
              "전체 흐름 자동 시연",
              "발화 수집",
              "Evidence map",
              "Review / Purge",
          ]
          missing = [token for token in required if token not in html]
          lowered = html.lower()
          exposed = [token for token in ("claude", "anthropic") if token in lowered]
          diagnostics = {"missing": missing, "provider_names_exposed": exposed, "html_length": len(html)}
          pathlib.Path("deployment-smoke-diagnostics.json").write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          if missing:
              raise SystemExit(f"missing rendered product landmarks: {missing}")
          if exposed:
              raise SystemExit(f"provider-specific names leaked into rendered demo: {exposed}")
          print("product shell contract verified")
          PY

      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-smoke-ui
          path: |
            live-demo.html
            deployment-smoke-diagnostics.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify operations and AI quality contracts
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")

          def get_json(path: str):
              with urllib.request.urlopen(f"{base}{path}", timeout=30) as response:
                  return json.load(response)

          operations = get_json("/v1/operations")
          expected_operations = {
              "database_ready": True,
              "database_backend": "sqlite",
              "transcript_store_ready": True,
              "transcript_store_backend": "memory",
              "note_generator_mode": "deterministic",
          }
          for key, expected in expected_operations.items():
              actual = operations.get(key)
              if actual != expected:
                  raise SystemExit(f"operations mismatch for {key}: {actual!r} != {expected!r}")

          quality = get_json("/v1/quality")
          if quality.get("clinical_validation") is not False:
              raise SystemExit("clinical_validation boundary must remain false")
          gates = {gate["key"]: gate for gate in quality.get("gates", [])}
          expected_statuses = {
              "rag": "verified_not_adopted",
              "sft": "adopted",
              "dpo": "rejected",
              "judge": "verified",
              "multimodal": "verified",
          }
          for key, expected in expected_statuses.items():
              if gates.get(key, {}).get("status") != expected:
                  raise SystemExit(f"quality status mismatch for {key}")

          sft = gates["sft"]["metrics"]
          dpo = gates["dpo"]["metrics"]
          if sft.get("base_reference_token_f1") != 0.0648:
              raise SystemExit("unexpected SFT base F1")
          if sft.get("candidate_reference_token_f1") != 0.1244:
              raise SystemExit("unexpected SFT candidate F1")
          if dpo.get("dpo_reference_token_f1") != 0.1093:
              raise SystemExit("unexpected DPO candidate F1")
          print("operations and quality contracts verified")
          PY

      - name: Execute synthetic live session end to end
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")

          def request_json(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode("utf-8")
              request = urllib.request.Request(
                  f"{base}{path}",
                  data=data,
                  method=method,
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          session = request_json("POST", "/v1/sessions", {"language": "ko"})
          session_id = session["session_id"]
          chunks = [
              {"sequence": 1, "speaker": "patient", "text": "최근 일주일 동안 잠드는 데 한 시간쯤 걸렸습니다."},
              {"sequence": 2, "speaker": "patient", "text": "아침에 피곤해서 업무에 집중하기 어려웠습니다."},
              {"sequence": 3, "speaker": "clinician", "text": "대화 중 말투와 호흡은 차분하게 관찰되었습니다."},
              {"sequence": 4, "speaker": "clinician", "text": "다음 주에 수면 기록을 함께 확인할 계획입니다."},
          ]
          for chunk in chunks:
              ack = request_json("POST", f"/v1/sessions/{session_id}/chunks", chunk)
              if ack.get("duplicate") is not False:
                  raise SystemExit(f"unexpected duplicate ack: {ack}")

          finalized = request_json("POST", f"/v1/sessions/{session_id}/finalize")
          if finalized.get("status") != "ready":
              raise SystemExit(f"normal synthetic session did not become READY: {finalized}")
          if finalized.get("review_required") is not False:
              raise SystemExit(f"normal synthetic session unexpectedly requires review: {finalized}")
          if finalized.get("transcript_purged") is not True:
              raise SystemExit(f"transcript was not purged after READY: {finalized}")

          draft = request_json("GET", f"/v1/sessions/{session_id}/draft")
          evidence = {item["section"]: item["source_sequences"] for item in draft["evidence"]}
          if evidence != {"subjective": [1, 2], "objective": [3], "plan": [4]}:
              raise SystemExit(f"unexpected evidence map: {evidence}")

          transcript = request_json("GET", f"/v1/sessions/{session_id}/transcript")
          if transcript.get("transcript_available") is not False or transcript.get("chunks") != []:
              raise SystemExit(f"purged transcript is still available: {transcript}")

          audit = request_json("GET", f"/v1/sessions/{session_id}/audit")
          event_types = {event["event_type"] for event in audit}
          required_events = {"session.finalized", "transcript.purged"}
          if not required_events <= event_types:
              raise SystemExit(f"missing lifecycle audit events: {required_events - event_types}")
          print(f"live E2E verified for synthetic session {session_id}")
          PY
