name: Demo Capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/demo-capture.yml
      - scripts/capture_live_demo.py

permissions:
  contents: read

jobs:
  capture:
    name: Capture 60-second live CareFlow walkthrough
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install browser capture dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture live Render walkthrough
        run: python scripts/capture_live_demo.py
      - name: Convert WebM to MP4
        run: |
          ffmpeg -y -i artifacts/demo/careflow-live-demo.webm \
            -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart \
            -an artifacts/demo/careflow-live-demo.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 artifacts/demo/careflow-live-demo.mp4
      - name: Upload demo video and D home screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: careflow-live-demo
          path: |
            artifacts/demo/careflow-live-demo.mp4
            artifacts/demo/careflow-live-demo.webm
            artifacts/demo/careflow-d-home.png
          if-no-files-found: error
          retention-days: 7
