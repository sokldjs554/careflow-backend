name: Demo Capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/demo-capture.yml
      - .github/workflows/deployment-smoke.yml
      - scripts/capture_live_demo.py
      - scripts/deployment_smoke.py
      - scripts/wait_for_render_release.py
      - pyproject.toml
      - README.md
      - app/main.py
      - app/api/routes.py
      - app/static/index.html
      - app/static/theme.css
      - app/static/detail-polish.css

permissions:
  contents: write

concurrency:
  group: careflow-demo-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture and verify live CareFlow walkthrough
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      BASE_URL: https://careflow-demo.onrender.com
      EXPECTED_DATABASE_BACKEND: sqlite
      EXPECTED_TRANSCRIPT_STORE_BACKEND: memory
      EXPECTED_ENVIRONMENT: render-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Wait for exact Render release
        env:
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
        run: python scripts/wait_for_render_release.py
      - name: Install browser capture dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture and verify live Render walkthrough
        run: python scripts/capture_live_demo.py
      - name: Convert WebM to MP4
        run: |
          ffmpeg -y -i artifacts/demo/careflow-live-demo.webm \
            -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart \
            -an artifacts/demo/careflow-live-demo.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 artifacts/demo/careflow-live-demo.mp4
      - name: Upload live verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: careflow-live-demo
          path: |
            artifacts/demo/careflow-live-demo.mp4
            artifacts/demo/careflow-live-demo.webm
            artifacts/demo/careflow-d-home.png
            artifacts/demo/careflow-live-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish stable demo assets
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp artifacts/demo/careflow-live-demo.mp4 "$publish_dir/"
          cp artifacts/demo/careflow-d-home.png "$publish_dir/"
          cp artifacts/demo/careflow-live-verification.json "$publish_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin demo-assets >/dev/null 2>&1; then
            git fetch origin demo-assets:demo-assets
            git switch demo-assets
          else
            git switch --orphan demo-assets
          fi

          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p demo
          cp "$publish_dir/careflow-live-demo.mp4" demo/
          cp "$publish_dir/careflow-d-home.png" demo/
          cp "$publish_dir/careflow-live-verification.json" demo/
          git add demo
          git commit -m "Update generated CareFlow demo assets" || true
          git push --force origin demo-assets
